name: Vela YouTube Android Debug

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vela-youtube-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
