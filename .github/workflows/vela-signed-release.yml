name: Vela YouTube 0.1.6 Release Candidate

on:
  push:
    branches:
      - release/v0.1.6-permanent-signing
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/vela-signed-release.yml'
      - 'scripts/verify_release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG verification dependency
        run: python -m pip install Pillow==11.3.0
      - name: Install Android SDK platform
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem "$env:ANDROID_HOME/cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (!$sdkmanager) { throw 'Android sdkmanager not found' }
          & $sdkmanager.FullName --install 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Build release
        shell: cmd
        run: gradlew.bat --no-daemon --stacktrace assembleRelease
      - name: Sign with verified VelaLab permanent keystore
        id: sign
        shell: pwsh
        env:
          VELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
          VELA_RELEASE_STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
          VELA_RELEASE_KEY_ALIAS: ${{ secrets.VELA_RELEASE_KEY_ALIAS }}
          VELA_RELEASE_KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('VELA_RELEASE_KEYSTORE_BASE64', 'VELA_RELEASE_STORE_PASSWORD', 'VELA_RELEASE_KEY_ALIAS', 'VELA_RELEASE_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing credential: $name" }
          }
          if ($env:VELA_RELEASE_KEY_ALIAS -cne 'vela-store') { throw 'Unexpected keystore alias' }
          $keystore = Join-Path $env:RUNNER_TEMP 'vela-release.jks'
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:VELA_RELEASE_KEYSTORE_BASE64))
            $keystoreSha256 = (Get-FileHash -LiteralPath $keystore -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($keystoreSha256 -ne '540e5d349ca14233e63fa199dce90f8c373e4673db70cebd2c11720a3a46700e') { throw 'CI keystore differs from the existing VelaLab file' }
            $certificatePem = & keytool -exportcert -rfc -storetype PKCS12 -keystore $keystore -alias $env:VELA_RELEASE_KEY_ALIAS -storepass:env VELA_RELEASE_STORE_PASSWORD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read certificate from permanent keystore' }
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPem(($certificatePem -join "`n"))
            $actual = [Convert]::ToHexString($certificate.GetCertHash([Security.Cryptography.HashAlgorithmName]::SHA256)).ToLowerInvariant()
            if ($actual -eq 'a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc') { throw 'AOSP test certificate is forbidden' }
            $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
            & $apksigner sign --ks $keystore --ks-type PKCS12 --ks-key-alias $env:VELA_RELEASE_KEY_ALIAS --ks-pass env:VELA_RELEASE_STORE_PASSWORD --key-pass env:VELA_RELEASE_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out 'app/build/outputs/apk/release/vela-youtube-release.apk' 'app/build/outputs/apk/release/app-release-unsigned.apk'
            if ($LASTEXITCODE -ne 0) { throw 'APK signing failed' }
            Write-Output "Verified keystore certificate SHA-256: $actual"
            "certificate_sha256=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } finally {
            if (Test-Path $keystore) { Remove-Item -LiteralPath $keystore -Force }
          }
      - name: Check release APK exists
        shell: pwsh
        run: |
          $apk = 'app/build/outputs/apk/release/vela-youtube-release.apk'
          if (!(Test-Path $apk) -or (Get-Item $apk).Length -lt 1024) { throw 'Signed APK missing or empty' }
          Get-FileHash $apk -Algorithm SHA256
      - name: Verify signature, identity, version and compiled PNG resources
        shell: pwsh
        env:
          VELA_RELEASE_CERT_SHA256: ${{ steps.sign.outputs.certificate_sha256 }}
        run: |
          python scripts/verify_release.py --apk app/build/outputs/apk/release/vela-youtube-release.apk --aapt "$env:ANDROID_HOME/build-tools/36.0.0/aapt.exe" --apksigner "$env:ANDROID_HOME/build-tools/36.0.0/apksigner.bat" --report app/build/outputs/apk/release/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: vela-youtube-v0.1.6-release-candidate
          path: |
            app/build/outputs/apk/release/vela-youtube-release.apk
            app/build/outputs/apk/release/verification.json
          if-no-files-found: error
          retention-days: 14
