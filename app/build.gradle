apply plugin: 'com.android.application'

android {
    // Keep the upstream namespace until Java source package migration is audited.
    namespace "com.google.android.youtube.pro"
    compileSdk 36

    defaultConfig {
        applicationId "net.velalab.youtube"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0-dev"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
}
